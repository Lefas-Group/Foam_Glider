# What this chapter IS, for routing a question to it. Not rendered -- the page
# says it with its title, its fork link and its items. One sentence: the aero
# method, the section, what is left out.
defines: FliteTest X-Wing airframe cut from 5.0 mm foam at 174.4 g/m2, flat plate throughout, modelled with AeroBuildup.

specified:
  - dihedral: 20 degrees determines the cross-angle of the X-wing.
  - static-margin: 10% of the mean aerodynamic chord, which fixes the CG.

assumed:
  - wing-position: Wing leading edge at x=0.25 m, mid-fuselage.
  - engine-gun-position: Engines at the wing root, guns at the tip.
  - airfoil: NACA0006, a proxy for 5 mm flat plate.
  - wing_pos: Wing position x=0.25m, z=0.0381m, not given on plan.
  - engines_guns: Engines near root, guns at tip, placed visually.
  - airfoil: NACA0006 as proxy for 5mm thick flat plate.
