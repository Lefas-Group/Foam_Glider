# What this chapter IS, for routing a question to it. Not rendered -- the page
# says it with its title, its fork link and its items. One sentence: the aero
# method, the section, what is left out.
defines: Geometry and mass from published figures and store photographs; AVL; flat-plate foam airfoil.

# What this chapter NEWLY committed to and NEWLY assumed. Rendered into its
# index.qmd by `chapter_inputs()` -- do NOT write those callouts by hand, or
# every item appears on the page twice.
#
# `- <id>: <text>` — the id is a handle, not prose, and need only be unique
# within this file. It is how another chapter names this item when it replaces
# it. Rule 8: ten words per item.
#
# The test for what belongs here: IS IT TRUE OF EVERY ENTRY THIS CHAPTER WILL
# HAVE? A number one question produced belongs in that entry. Leave a block
# empty rather than inventing an item -- an empty callout is never rendered.
specified:
  - fuselage-max-width: Fuselage max width 255 mm, measured off headon mask.
assumed:
  - wing-planform: Chords 330 to 145 mm, dihedral 2.0 deg.
  - nacelle-stations: Nacelle stations inboard y=270 mm, outboard y=490 mm.
  - stand-in-airfoil: NACA 0008 symmetric section stand-in for folded foam.
  - airframe-mass: Airframe foam density 280 g/m² plus glue and hardware.


overwrites:
  - brief/chord-taper-dihedral: chords and dihedral from photographs
  - brief/fuselage-stations-from: fuselage stations from photographs
  - brief/nacelle-size-and: nacelle stations from photographs
  - brief/airfoil-flat-foam: folded foam wing NACA 0008 stand-in
  - brief/wing-area-not: derived from reconstructed planform
  - brief/wing-loading-not: derived from dry mass and area

