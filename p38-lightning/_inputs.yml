# THE BRIEF for the aircraft. True of the whole aircraft, inherited by every
# chapter and every entry, and never superseded: a fork that departs from one
# of these is not a fork, it is a different aircraft and so a different
# notebook. Written by a PERSON, never by a run.
#
# Rendered into index.qmd. Same format as a chapter's `_inputs.yml`:
# `- <id>: <text>`, ten words each.
#
# The test for what belongs here rather than in the first chapter: IF THIS
# CHANGED, WOULD IT STILL BE THE SAME AEROPLANE? A 300 mm span, no. Foam 5 mm
# — yes, that is the same project at a different thickness, so it is a chapter.
specified:
  - ft-master-series: "**FT Master Series P-38 Lightning MkR2**, Flite Test."
  - twin-boom-central: "**Twin boom**, central crew nacelle, twin fins."
  - tailplane-spans-between: "**Tailplane** spans between the two booms."
  - two-tractor-motors: "**Two tractor motors**, one at each boom nose."
  - power-pack-c: "**Power Pack C Twin**: two motors, two ESCs."
  - battery-2200-3300: "**Battery**: 2200-3300 mAh 3S LiPo."
  - maker-foam-8: "**Maker Foam**, 8 laser-cut sheets, folded and glued."
  - four-channels-minimum: "**Four channels** minimum; aileron, elevator, rudder."
  - build-level-challenging: "**Build level challenging**, flying level medium."
assumed:
  - no-plan-sheet: "**No plan sheet**: Flite Test sell these plans."
  - length-not-published: "**Length not published**; fit it, declare it."
  - dry-weight-not: "**Dry weight not published**; no independent scale check."
  - wing-area-not: "**Wing area not published**; derive it and declare it."
  - chords-taper-boom: "**Chords, taper, boom stations fitted** to the photograph."
