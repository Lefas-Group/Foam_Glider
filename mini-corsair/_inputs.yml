# THE BRIEF for the aircraft. True of the whole aircraft, inherited by every
# chapter and every entry, and never superseded: a fork that departs from one
# of these is not a fork, it is a different aircraft and so a different
# notebook. Written by a PERSON, never by a run.
#
# Rendered into index.qmd. Same format as a chapter's `_inputs.yml`:
# `- <id>: <text>`, ten words each.
#
# The test for what belongs here rather than in the first chapter: IF THIS
# CHANGED, WOULD IT STILL BE THE SAME AEROPLANE? A 300 mm span, no. Foam 5 mm
# — yes, that is the same project at a different thickness, so it is a chapter.
specified:
  - ft-mini-corsair: "**FT Mini Corsair v1.0**, Flite Test free plan."
  - folded-maker-foam: "**Folded Maker Foam**, hand cut and hot glued."
  - inverted-gull-wing: "**Inverted gull wing**, tractor prop, conventional tail."
  - power-2204-2200: "**Power**: 2204 2200 kv, 6x4.5 prop, 3S."
  - battery-850-mah: "**Battery**: 850 mAh 3S LiPo, 12 A ESC."
  - controls-aileron-elevator: "**Controls**: aileron, elevator, rudder; 12 deg throws."
targets:
  - length-482-mm: "**Length**: 482 mm (19 in), +/-2%."
  - wing-span-610: "**Wing span**: 610 mm (24 in), +/-1%."
  - wing-area-6: "**Wing area**: 6.9 dm2 (107 in2), +/-3%."
  - cg-38-mm: "**CG**: 38 mm aft of wing leading edge, +/-8%."
  - dry-weight-156: "**Dry weight**: 156 g without battery, +/-5%."
  - all-up-weight: "**All-up weight**: 222 g with pack, +/-5%."
  - wing-loading-32: "**Wing loading**: 32.0 g/dm2 published, +/-4%."
  - wing-cubic-loading: "**Wing cubic loading**: 12.2 published, +/-6%."
