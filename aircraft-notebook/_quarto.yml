project:
  type: website
  output-dir: _site
  # Run every cell from the aircraft-notebook/ root so relative paths mean the
  # same thing regardless of which page is being rendered.
  execute-dir: project

website:
  title: "Aircraft Notebook"
  description: "A chronological record of questions asked while designing a new aircraft."
  # Next/Previous links in each page footer, so entries read straight through.
  page-navigation: true
  sidebar:
    style: docked
    contents:
      # One `auto:` per chapter, listed newest-design-first. Entries within a
      # chapter are still discovered automatically -- filenames start with their
      # date, so alphabetical order is chronological order -- but the CHAPTER
      # order is fixed here on purpose.
      #
      # A bare `auto: "chapters"` does not work: it emits sections in raw
      # directory-listing order, which on APFS is unsorted. Neither the
      # directory name nor the chapter title changes it (both tested), so the
      # only way to put the live design on top is to name the chapters here.
      # Adding a chapter means adding a line -- the one bit of maintenance this
      # buys, in exchange for an order that survives a fresh clone.
      - auto: "chapters/00-mceagle-refined-notebook"
      - auto: "chapters/02-mceagle-300"
      - auto: "chapters/01-aerobuildup-bfg"

format:
  html:
    toc: true
    toc-depth: 3
    # Scales matplotlib output down to the content column so pages never scroll
    # sideways.
    css: styles.css
    # Code is folded away everywhere by default -- the prose and figures are the
    # content; the code is there when you want to check it.
    code-fold: true
    code-summary: "Show code"
    code-copy: true
    code-overflow: wrap
    fig-width: 8
    fig-height: 4.5
    fig-dpi: 150

execute:
  # Entries are written once, debugged, then left alone -- so freeze genuinely
  # freezes them. Commit _freeze/ so a fresh clone renders without re-solving.
  # NOTE: freeze tracks the page file, not its includes -- so editing a
  # chapter's _model.py does NOT invalidate its entries. Delete
  # _freeze/chapters/NN-name/ and render normally. There is no --no-freeze flag.
  freeze: auto
  warning: false
