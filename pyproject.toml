[project]
name = "foam-glider"
version = "0.1.0"
description = "Design notebook for a hand-launched foam glider"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aerosandbox>=4.2.10",
    "matplotlib>=3.9",
    # Quarto needs both of these to execute Python cells in .qmd files.
    "jupyter>=1.1",
    "pyyaml>=6.0",
]

# Tooling, not notebook runtime -- the library-explorer MCP server that the
# design-notebook skill uses to look up AeroSandbox APIs. Kept out of the main
# dependencies so `uv sync` for the notebook alone stays lean.
# The `nb` agent (nb/). Kept in its own group so `uv sync` for the notebook
# alone stays lean -- rendering a notebook needs none of this.
[dependency-groups]
nb = [
    # >=2.23: thinking_level lands here. On 1.x ThinkingConfig exposes only
    # include_thoughts/thinking_budget and the attribute is simply absent.
    "google-genai>=2.23",
    "pydantic>=2.11",
    # MCP filesystem server client. Pinned <2 to match the existing group.
    "mcp>=1.2,<2",
    # The one dependency on the READING side: `nb board` and `nb watch`.
    # Hand-rolled ANSI was tried and shipped an invisible bug -- `\x1b[2m` is
    # correct and macOS Terminal.app ignores it, so the dimming never appeared.
    # rich asks the terminal what it supports, and strips styling when piped.
    "rich>=13",
    # CMA-ES. Replaces a hand-rolled 36-seed grid + Nelder-Mead in _fit_pose:
    # the grid failed every cold start on an oblique view (42-65 deg elevation
    # against a true 24), and 40x more seeds did not fix it -- the ranking was
    # wrong, not the density. CMA-ES also has no zero-seeded-simplex trap.
    "cma>=4",
]
# Pinned to 1.x: the vendored server uses mcp.server.fastmcp.FastMCP,
# which 2.x renamed to MCPServer.
mcp = ["mcp>=1.2,<2"]
