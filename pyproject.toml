[project]
name = "foam-glider"
version = "0.1.0"
description = "Design notebook for a hand-launched foam glider"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aerosandbox>=4.2.10",
    "matplotlib>=3.9",
    # Quarto needs both of these to execute Python cells in .qmd files.
    "jupyter>=1.1",
    "pyyaml>=6.0",
]

# The `nb` agent (nb/). Kept in its own group so `uv sync` for the notebook
# alone stays lean -- rendering a notebook needs none of this.
[dependency-groups]
nb = [
    # >=2.23: thinking_level lands here. On 1.x ThinkingConfig exposes only
    # include_thoughts/thinking_budget and the attribute is simply absent.
    "google-genai>=2.23",
    "pydantic>=2.11",
    # Two users now, which is why this moved into the one group: `mcp_fs`
    # is a CLIENT of the npx filesystem server, and
    # `tools/library_explorer_server.py` is a SERVER of our own. Pinned <2
    # because the server builds on `mcp.server.fastmcp.FastMCP`, which 2.x
    # renamed to MCPServer.
    "mcp>=1.2,<2",
    # The one dependency on the READING side: `nb board` and `nb watch`.
    # Hand-rolled ANSI was tried and shipped an invisible bug -- `\x1b[2m` is
    # correct and macOS Terminal.app ignores it, so the dimming never appeared.
    # rich asks the terminal what it supports, and strips styling when piped.
    "rich>=13",
    # CMA-ES. Replaces a hand-rolled 36-seed grid + Nelder-Mead in _fit_pose:
    # the grid failed every cold start on an oblique view (42-65 deg elevation
    # against a true 24), and 40x more seeds did not fix it -- the ranking was
    # wrong, not the density. CMA-ES also has no zero-seeded-simplex trap.
    "cma>=4",
    # Reference masks, for `nb mask`. By far the heaviest thing in this group
    # -- ~29 packages, onnxruntime and (through pymatting) scikit-image, numba
    # and llvmlite -- and it is here rather than in a group of its own so that
    # `nb mask` needs no sync step anyone can forget. Weights are NOT shipped:
    # 214 MB lands in ~/.rembg on first use.
    #
    # Chosen by measurement over all 13 committed masks. birefnet-general-lite
    # scored IoU 0.950 against them and 0.992 against the one mask that is
    # exactly right (a vendor alpha channel), with a boundary CLEANER than the
    # hand-cut masks on the 5 px smoothing test -- 1.5% against 3.0%. isnet
    # tied on accuracy with rougher edges; u2net scored 0.031 on the control.
    #
    # ALWAYS PIN THE SESSION. rembg's own default is `bria-rmbg`, whose weights
    # need a paid agreement for commercial use; rembg is MIT but says plainly
    # that "model weights carry their own licenses". BiRefNet is MIT, both code
    # and weights.
    "rembg[cpu]>=2.0.60",
    # HEIC, which is what a phone writes. `nb intake` takes photographs the
    # user shot themselves, and every one of them arrives in a format Pillow
    # cannot open unaided -- so without this the common case fails at the
    # door. One wheel, libheif bundled, and it works on any platform: the
    # alternative was shelling out to macOS `sips`, which is a second decode
    # path that silently does not exist anywhere else.
    "pillow-heif>=0.18",
]
