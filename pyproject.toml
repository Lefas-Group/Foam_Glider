[project]
name = "foam-glider"
version = "0.1.0"
description = "Design notebook for a hand-launched foam glider"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aerosandbox>=4.2.10",
    "matplotlib>=3.9",
