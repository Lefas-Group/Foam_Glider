# THE BRIEF for the aircraft. True of the whole aircraft, inherited by every
# chapter and every entry, and never superseded: a fork that departs from one
# of these is not a fork, it is a different aircraft and so a different
# notebook. Written by a PERSON, never by a run.
#
# Rendered into index.qmd. Same format as a chapter's `_inputs.yml`:
# `- <id>: <text>`, ten words each.
#
# The test for what belongs here rather than in the first chapter: IF THIS
# CHANGED, WOULD IT STILL BE THE SAME AEROPLANE? A 300 mm span, no. Foam 5 mm
# — yes, that is the same project at a different thickness, so it is a chapter.
specified:
  - ft-mighty-mini: "**FT Mighty Mini Explorer**, Flite Test, stock trainer wing."
  - maker-foam-4: "**Maker Foam**, 4.7 mm laser-cut, hand folded and glued."
  - maker-foam-348: "**Maker Foam**: 348 g/m2 areal density, coated board."
  - high-wing-rubber: "**High wing**, rubber-banded onto a flat-top slab fuselage."
  - pusher-motor-at: "**Pusher**: motor at the fuselage break, aft of wing."
  - prop-disc-vertical: "**Prop disc vertical**, in a slot through the fuselage."
  - removable-nose-carries: "**Removable nose** carries the battery ahead of the wing."
  - conventional-tail-no: "**Conventional tail**, no landing gear in stock configuration."
  - power-ft-1806: "**Power**: FT 1806 2280 kv, 6x4.5 prop."
  - battery-850-mah: "**Battery**: 850 mAh 3S LiPo, 25 A ESC."
  - controls-aileron-elevator: "**Controls**: aileron, elevator, rudder; 12 deg, 30% expo."
targets:
  - wing-span-978: "**Wing span**: 978 mm (38.5 in), +/-1%."
  - length-692-mm: "**Length**: 692 mm (27.25 in), +/-2%."
  - dry-weight-400: "**Dry weight**: 400 g without battery, +/-6%."
  - cg-51-mm: "**CG**: 51 mm aft of leading edge, +/-8%. (given)"
assumed:
  - no-plan-sheet: "**No plan sheet**: Flite Test sell these plans."
  - wing-area-not: "**Wing area not published**; derive it and declare it."
  - wing-loading-not: "**Wing loading not published**; no independent scale check exists."
  - fuselage-stations-from: "**Fuselage stations from photographs**, declare every one invented."
  - claimed-unlimited-vertical: "**Claimed unlimited vertical climb** on 3S, to verify."
  - claimed-ten-minute: "**Claimed ten-minute flight time**, to verify."
