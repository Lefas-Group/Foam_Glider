# The axes this notebook explores.
#
# A chapter index tags itself with `categories:` drawn from this file, and rule
# 36 refuses anything that is not here. That is the whole drift protection:
# without it you get "5mm", "5 mm" and "5 mm foam" as three separate tags and the
# grouping quietly stops working.
#
# IT LIVES IN THE NOTEBOOK, not in `nb`, on purpose. An axis is something a
# notebook notices about ITSELF, usually after several chapters exist -- chapter
# 01 could not know that foam thickness would become an axis, and chapter 04 is
# where it did. So adding a term is one line here, not a change to the tool.
#
# The axis names are for readers of this file. Rule 36 checks membership in the
# flattened set of values, so a term may sit under any axis.

axes:
  # What the aircraft is cut from. The span is fixed at 300 mm throughout, so it
  # is not an axis -- it does not distinguish one chapter from another.
  vehicle:
    - 5 mm foam
    - 3 mm foam

  # How the geometry was arrived at. The line chapters 01-04 share is a hand
  # sized planform with a few variables solved; 05 opens almost everything to
  # the optimiser at once, which is what makes 05 and 06 a pair.
  method:
    - manual sizing
    - full optimisation

  # What the model carries, cumulatively -- each chapter keeps what its parent
  # modelled and adds one thing.
  fidelity:
    - wing only
    - fuselage
    - unswept quarter chord
